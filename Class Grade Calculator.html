<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Class Grade Calculator</title>
  <style>
    :root {
      --bg: #f3f5f0;
      --surface: #fff;
      --ink: #1d2a24;
      --muted: #5e6c64;
      --line: #d5dcd3;
      --accent: #1f5c46;
      --accent-ink: #fff;
      --soft: #e4eee8;
      --bad: #a8321f;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #141a17;
        --surface: #1c2420;
        --ink: #e8eee9;
        --muted: #9baba1;
        --line: #2f3b35;
        --accent: #6fcf9f;
        --accent-ink: #0f1c15;
        --soft: #243029;
        --bad: #ff8f7a;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #141a17;
      --surface: #1c2420;
      --ink: #e8eee9;
      --muted: #9baba1;
      --line: #2f3b35;
      --accent: #6fcf9f;
      --accent-ink: #0f1c15;
      --soft: #243029;
      --bad: #ff8f7a;
      color-scheme: dark
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 Montserrat, "Segoe UI", Arial, sans-serif
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 16px 40px
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 4px;
      letter-spacing: -.01em
    }

    .sub {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: .95rem
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px
    }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 12px
    }

    label {
      display: block;
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 4px
    }

    input[type=text],
    input[type=number] {
      width: 100%;
      font: inherit;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink)
    }

    input:focus,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    @media (max-width:560px) {
      .grid {
        grid-template-columns: 1fr
      }
    }

    .comp {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--bg)
    }

    .comp b {
      display: block;
      margin-bottom: 8px
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px
    }

    .seg button {
      flex: 1;
      font: inherit;
      font-size: .85rem;
      padding: 6px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer
    }

    .seg button[aria-pressed=true] {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .row>div {
      flex: 1;
      min-width: 120px
    }

    .btn {
      font: inherit;
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      font-weight: bold
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
      font-weight: normal;
      padding: 6px 10px;
      font-size: .85rem
    }

    .err {
      color: var(--bad);
      min-height: 1.4em;
      margin: 8px 0 0;
      font-size: .9rem
    }

    .scroll {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px
    }

    th,
    td {
      padding: 9px 8px;
      text-align: right;
      border-bottom: 1px solid var(--line)
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    th {
      font-size: .85rem;
      color: var(--muted);
      font-weight: normal
    }

    td.final {
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--accent)
    }

    .empty {
      color: var(--muted);
      margin: 0
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap
    }

    h1,
    h2,
    .btn,
    .seg button,
    th {
      font-family: Poppins, Montserrat, "Segoe UI", Arial, sans-serif
    }

    h1,
    h2 {
      font-weight: 600
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Class Grade Calculator</h1>
    <p class="sub">Written Works 25% · Performance Task 50% · Examination 25%</p>

    <div class="card">
      <h2>How will you enter scores?</h2>
      <div class="grid" id="comps"></div>
    </div>

    <div class="card">
      <h2>Add a student</h2>
      <label for="name">Student name</label>
      <input type="text" id="name" autocomplete="off">
      <div class="row">
        <div><label for="ww">Written Works</label><input type="number" id="ww" min="0" step="any" inputmode="decimal">
        </div>
        <div><label for="pt">Performance Task</label><input type="number" id="pt" min="0" step="any"
            inputmode="decimal"></div>
        <div><label for="ex">Examination</label><input type="number" id="ex" min="0" step="any" inputmode="decimal">
        </div>
      </div>
      <div class="row"><button class="btn" id="add">Add student</button></div>
      <p class="err" id="err" role="alert"></p>
    </div>

    <div class="card">
      <div class="bar">
        <h2 style="margin:0">Class list</h2>
        <div style="display:flex;gap:8px"><button class="btn ghost" id="export">Export to Excel</button><button
            class="btn ghost" id="clear">Clear all</button></div>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>WW (25%)</th>
              <th>PT (50%)</th>
              <th>Exam (25%)</th>
              <th>Final grade</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="empty" id="empty">No students yet. Add one above.</p>
      <p class="err" id="xmsg" role="status"></p>
    </div>
  </div>

  <script>
    var KEY = "gradecalc.v1";
    var C = [{ k: "ww", n: "Written Works", w: .25 }, { k: "pt", n: "Performance Task", w: .5 }, { k: "ex", n: "Examination", w: .25 }];
    var state = { mode: { ww: "raw", pt: "raw", ex: "raw" }, total: { ww: "", pt: "", ex: "" }, students: [] };
    try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.students) state = s } catch (e) { }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(state)) } catch (e) { } }
    function $(id) { return document.getElementById(id) }
    function fmt(n) { return (Math.round(n * 100) / 100).toFixed(2) }

    function renderComps() {
      var h = "";
      C.forEach(function (c) {
        var raw = state.mode[c.k] === "raw";
        h += '<div class="comp"><b>' + c.n + '</b><div class="seg">'
          + '<button data-k="' + c.k + '" data-m="raw" aria-pressed="' + raw + '">Raw score</button>'
          + '<button data-k="' + c.k + '" data-m="pct" aria-pressed="' + !raw + '">Percent</button></div>'
          + (raw ? '<label for="t_' + c.k + '">Total items</label><input type="number" id="t_' + c.k + '" min="1" step="any" inputmode="decimal" value="' + (state.total[c.k] || "") + '">' : '<label>Score from 0 to 100</label>')
          + '</div>';
      });
      $("comps").innerHTML = h;
      $("comps").querySelectorAll("button").forEach(function (b) { b.onclick = function () { state.mode[b.dataset.k] = b.dataset.m; save(); renderComps() } });
      $("comps").querySelectorAll("input").forEach(function (i) { i.oninput = function () { state.total[i.id.slice(2)] = i.value; save() } });
      C.forEach(function (c) { $(c.k).placeholder = state.mode[c.k] === "raw" ? "Score" : "0–100" });
    }

    function renderRows() {
      var h = "";
      state.students.forEach(function (st, i) {
        var f = st.ww * .25 + st.pt * .5 + st.ex * .25;
        h += '<tr><td>' + esc(st.name) + '</td><td>' + fmt(st.ww) + '</td><td>' + fmt(st.pt) + '</td><td>' + fmt(st.ex) + '</td><td class="final">' + fmt(f) + '</td><td><button class="btn ghost" data-i="' + i + '" aria-label="Remove ' + esc(st.name) + '">Remove</button></td></tr>';
      });
      $("rows").innerHTML = h;
      $("empty").style.display = state.students.length ? "none" : "block";
      $("rows").querySelectorAll("button").forEach(function (b) { b.onclick = function () { state.students.splice(+b.dataset.i, 1); save(); renderRows() } });
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] }) }

    $("add").onclick = function () {
      var err = $("err"); err.textContent = "";
      var name = $("name").value.trim();
      if (!name) { err.textContent = "Enter the student’s name."; return }
      var pct = {};
      for (var i = 0; i < C.length; i++) {
        var c = C[i], v = $(c.k).value;
        if (v === "") { err.textContent = "Enter the " + c.n + " score."; return }
        v = parseFloat(v);
        if (isNaN(v) || v < 0) { err.textContent = c.n + " must be 0 or higher."; return }
        if (state.mode[c.k] === "raw") {
          var t = parseFloat(state.total[c.k]);
          if (!t || t <= 0) { err.textContent = "Enter the total items for " + c.n + "."; return }
          if (v > t) { err.textContent = c.n + " score can’t be higher than " + t + " items."; return }
          pct[c.k] = v / t * 100;
        } else {
          if (v > 100) { err.textContent = c.n + " percent can’t be higher than 100."; return }
          pct[c.k] = v;
        }
      }
      var raw = {}, tot = {};
      C.forEach(function (c) { var r = state.mode[c.k] === "raw"; raw[c.k] = r ? parseFloat($(c.k).value) : null; tot[c.k] = r ? parseFloat(state.total[c.k]) : null });
      state.students.push({ name: name, ww: pct.ww, pt: pct.pt, ex: pct.ex, raw: raw, tot: tot });
      save(); renderRows();
      $("name").value = ""; C.forEach(function (c) { $(c.k).value = "" }); $("name").focus();
    };
    $("clear").onclick = function () {
      if (state.students.length && confirm("Remove all students from the list?")) { state.students = []; save(); renderRows() }
    };
    function rd(v) { return Math.round(v * 100) / 100 }
    function num(v) { return typeof v === "number" && !isNaN(v) ? v : "" }
    $("export").onclick = async function () {
      var m = $("xmsg"); m.textContent = "";
      if (!state.students.length) { m.textContent = "Add at least one student before exporting."; return }
      if (typeof XLSX === "undefined") { m.textContent = "The Excel library didn’t load. Check your connection and reload the page."; return }
      var dl = null;
      try { dl = await window.claude.use("downloads") } catch (e) { }
      if (!dl) { m.textContent = "Export isn’t available in this view. Open the page in claude.ai to export."; return }
      var rows = [["Student", "WW score", "WW total items", "WW %", "PT score", "PT total items", "PT %", "Exam score", "Exam total items", "Exam %", "Final grade"]];
      state.students.forEach(function (s) {
        var r = s.raw || {}, t = s.tot || {};
        rows.push([s.name, num(r.ww), num(t.ww), rd(s.ww), num(r.pt), num(t.pt), rd(s.pt), num(r.ex), num(t.ex), rd(s.ex), rd(s.ww * .25 + s.pt * .5 + s.ex * .25)]);
      });
      var ws = XLSX.utils.aoa_to_sheet(rows);
      ws["!cols"] = [{ wch: 28 }, { wch: 10 }, { wch: 14 }, { wch: 8 }, { wch: 10 }, { wch: 14 }, { wch: 8 }, { wch: 11 }, { wch: 16 }, { wch: 8 }, { wch: 12 }];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Grades");
      var buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
      try {
        await dl.save({ filename: "class-grades.xlsx", data: buf });
        m.style.color = "var(--muted)"; m.textContent = "Exported class-grades.xlsx.";
      } catch (e) {
        m.style.color = "";
        m.textContent = (e && e.code === "declined") ? "Export cancelled." : "Couldn’t export the file. Try again.";
      }
    };
    renderComps(); renderRows();
  </script>
</body>

</html>
